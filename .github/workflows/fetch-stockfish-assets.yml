name: Install and verify full single-threaded Stockfish 19 WASM
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-stockfish-assets.yml"
      - ".gitattributes"
      - "js/board.js"
      - "js/engine-loader.js"
      - "js/runtime-bridge.js"
      - "js/background.js"
      - "js/popup.js"
      - "html/popup.html"
      - "manifest.json"
      - "scripts/smoke-stockfish.mjs"
      - "scripts/smoke-berserk.mjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stockfish-assets
  cancel-in-progress: false
jobs:
  install-engine-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          persist-credentials: true
      - name: Validate extension source files
        shell: bash
        run: |
          set -euo pipefail
          for file in js/board.js js/engine-loader.js js/runtime-bridge.js js/background.js js/popup.js scripts/smoke-stockfish.mjs scripts/smoke-berserk.mjs; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
          echo "JavaScript syntax and manifest JSON are valid."
      - name: Download and verify Stockfish and Berserk WASM engines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine
          base="https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1"
          curl --fail --location --retry 3 --retry-delay 2 "$base/stockfish-19-single.js" --output engine/stockfish-19.js
          curl --fail --location --retry 3 --retry-delay 2 "$base/stockfish-19-single.wasm" --output engine/stockfish-19.wasm
          magic="$(head -c 4 engine/stockfish-19.wasm | od -An -tx1 | tr -d '[:space:]')"
          test "$magic" = "0061736d" || { echo "Invalid WASM magic bytes"; exit 1; }
          js_size="$(wc -c < engine/stockfish-19.js)"
          wasm_size="$(wc -c < engine/stockfish-19.wasm)"
          test "$js_size" -gt 10000 || { echo "Full engine JS loader is unexpectedly small"; exit 1; }
          test "$wasm_size" -gt 80000000 || { echo "Full engine WASM is unexpectedly small"; exit 1; }
          total_size=$((js_size + wasm_size))
          test "$total_size" -gt 80000000 || { echo "Full engine pair is unexpectedly small"; exit 1; }
          grep -q "Stockfish" engine/stockfish-19.js
          ! grep -q "SharedArrayBuffer" engine/stockfish-19.js
          ! grep -q "new Worker" engine/stockfish-19.js
          echo "Validated official full Stockfish 19 assets (JS: $js_size bytes; WASM: $wasm_size bytes)."
          node scripts/smoke-stockfish.mjs

          # Keep the browser bindings and WASM binary in sync with Berserk Web.
          mkdir -p engine/berserk
          berserk_raw="https://raw.githubusercontent.com/official-knightly/Berserk-web/main/engine"
          berserk_media="https://media.githubusercontent.com/media/official-knightly/Berserk-web/main/engine"
          curl --fail --location --retry 3 --retry-delay 2 "$berserk_raw/berserk.js" --output engine/berserk/berserk.js
          curl --fail --location --retry 3 --retry-delay 2 "$berserk_raw/berserk.d.ts" --output engine/berserk/berserk.d.ts
          curl --fail --location --retry 3 --retry-delay 2 "$berserk_media/berserk_bg.wasm" --output engine/berserk/berserk_bg.wasm
          node --check engine/berserk/berserk.js
          berserk_js_size="$(wc -c < engine/berserk/berserk.js)"
          berserk_wasm_size="$(wc -c < engine/berserk/berserk_bg.wasm)"
          berserk_magic="$(head -c 4 engine/berserk/berserk_bg.wasm | od -An -tx1 | tr -d '[:space:]')"
          test "$berserk_js_size" -gt 8000 || { echo "Berserk JavaScript bindings are incomplete"; exit 1; }
          test "$berserk_wasm_size" -gt 1000000 || { echo "Berserk WASM download is incomplete"; exit 1; }
          test "$berserk_wasm_size" -lt 100000000 || { echo "Berserk WASM size is unexpected"; exit 1; }
          test "$berserk_magic" = "0061736d" || { echo "Invalid Berserk WASM magic bytes"; exit 1; }
          echo "Validated Berserk bindings (JS: $berserk_js_size bytes; WASM: $berserk_wasm_size bytes)."
          node scripts/smoke-berserk.mjs
      - name: Commit engine assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stockfish-19.js engine/stockfish-19.wasm engine/berserk/
          if git diff --cached --quiet; then
            echo "Verified full Stockfish assets are already current."
            exit 0
          fi
          git commit -m "Sync and verify Stockfish and Berserk WASM engines"

          # Other commits can land while large LFS assets are being downloaded.
          # Rebase this generated asset commit on the latest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main-branch update; retrying rebase (attempt $attempt)."
            git rebase --abort || true
            sleep "$attempt"
          done
          echo "Could not push engine assets after three synchronized attempts."
          exit 1
