name: Fetch Stockfish WASM assets
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-stockfish-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stockfish-assets
  cancel-in-progress: false
jobs:
  fetch-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download matching Stockfish 19.0.0 npm distribution
        shell: bash
        run: |
          set -euo pipefail
          npm pack stockfish@19.0.0 --silent
          mkdir -p /tmp/sf package-unpacked engine
          tar -xzf stockfish-19.0.0.tgz -C /tmp/sf
          find /tmp/sf/package -type f -name 'stockfish-19-lite.wasm' -print -quit | grep -q .
          cp "$(find /tmp/sf/package -type f -name 'stockfish-19-lite.wasm' -print -quit)" engine/stockfish.wasm
          worker="$(find /tmp/sf/package -type f -name 'stockfish.worker.js' -print -quit || true)"
          if [ -n "$worker" ]; then cp "$worker" engine/stockfish.worker.js; fi
          test -s engine/stockfish.wasm
          file engine/stockfish.wasm
      - name: Commit engine assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stockfish.wasm engine/stockfish.worker.js
          if git diff --cached --quiet; then
            echo "No engine asset changes."
            exit 0
          fi
          git commit -m "Add Stockfish WASM engine assets"
          git push
