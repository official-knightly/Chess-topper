name: Fetch Stockfish WASM assets
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-stockfish-assets.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stockfish-assets
  cancel-in-progress: false
jobs:
  fetch-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download matching Stockfish 19.0.1 npm distribution
        shell: bash
        run: |
          set -euo pipefail
          npm pack stockfish@19.0.1 --silent
          mkdir -p /tmp/sf engine
          tar -xzf stockfish-19.0.1.tgz -C /tmp/sf
          wasm="$(find /tmp/sf/package -type f -name 'stockfish-19-lite.wasm' -print -quit)"
          worker="$(find /tmp/sf/package -type f -name 'stockfish.worker.js' -print -quit)"
          test -n "$wasm" && test -s "$wasm" || { echo "Matching Stockfish WASM was not found in the npm package."; exit 1; }
          test -n "$worker" && test -s "$worker" || { echo "Stockfish pthread worker was not found; this wrapper needs it."; exit 1; }
          cp "$wasm" engine/stockfish.wasm
          cp "$worker" engine/stockfish.worker.js
          test "$(head -c 4 engine/stockfish.wasm | od -An -tx1 | tr -d ' \n')" = "0061736d"
      - name: Commit engine assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/stockfish.wasm engine/stockfish.worker.js
          if git diff --cached --quiet; then
            echo "No engine asset changes."
            exit 0
          fi
          git commit -m "Add Stockfish WASM engine assets"
          git push
