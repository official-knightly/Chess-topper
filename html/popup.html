<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/popup.css">
  <title>Chess Topper</title>
</head>
<body>
  <main>
    <div class="brand"><span class="knight">♞</span><div><b>Chess Topper</b><small>Local chess analysis</small></div></div>
    <div class="notice">Use for analysis, puzzles, and post-game review—not during live rated games.</div>
    <label class="row"><span>Analysis source</span><select id="analysisMode"><option value="auto">Auto: server → WASM</option><option value="wasm">Local WASM</option><option value="server">Server only</option></select></label>
    <label class="switchrow"><span>Show evaluation bar</span><input id="bar" type="checkbox" checked></label>
    <label class="switchrow"><span>Show best-move arrow</span><input id="arrow" type="checkbox" checked></label>
    <label class="row"><span>Stockfish API key</span><input id="apiKey" type="password" autocomplete="off" placeholder="Paste rotated key" style="width:145px;min-width:0"></label>
    <small class="keyhint">Stored only in this browser profile; never commit your key.</small>
    <label class="row"><span>Analysis depth</span><select id="depth"><option value="8">Quick · 8</option><option value="12" selected>Normal · 12</option><option value="16">Deep · 16</option></select></label>
    <button id="apply">Apply to this tab</button>
    <p id="status" role="status">Ready</p>
    <script src="../js/popup.js"></script>
  </main>
</body>
</html>
